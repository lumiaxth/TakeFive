<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="blocked.css" />
    <title>TakeFive</title>
  </head>
  <body>
    <div class="card">
      <div id="icon" class="icon"></div>
      <h1 id="title"></h1>
      <p id="reason" class="reason"></p>
      <div class="buttons">
        <button id="btnBreak" class="btn primary" type="button" hidden data-i18n="breakFor"></button>
        <button id="btnBack" class="btn" type="button" data-i18n="goBack"></button>
      </div>
      <p class="brand" data-i18n="extNameShort"></p>
    </div>

    <script src="../shared/tldts.min.js"></script>
    <script src="../shared/hostname.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../content/countdown.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
