<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="welcome.css" />
    <title data-i18n="extNameShort"></title>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="../icons/icon128.png" alt="" />
      <h1 data-i18n="welcomeTitle"></h1>
      <p class="subtitle" data-i18n="welcomeSubtitle"></p>

      <ul class="features">
        <li>
          <span class="f-icon">&#9201;&#65039;</span>
          <span class="f-text">
            <strong data-i18n="welcomeFeature1Title"></strong>
            <span data-i18n="welcomeFeature1Body"></span>
          </span>
        </li>
        <li>
          <span class="f-icon">&#128274;</span>
          <span class="f-text">
            <strong data-i18n="welcomeFeature2Title"></strong>
            <span data-i18n="welcomeFeature2Body"></span>
          </span>
        </li>
        <li>
          <span class="f-icon">&#127813;</span>
          <span class="f-text">
            <strong data-i18n="welcomeFeature3Title"></strong>
            <span data-i18n="welcomeFeature3Body"></span>
          </span>
        </li>
      </ul>

      <div class="buttons">
        <button id="btnOpenSettings" class="btn primary" type="button" data-i18n="welcomeOpenSettings"></button>
        <button id="btnStart" class="btn" type="button" data-i18n="welcomeStart"></button>
      </div>

      <p class="brand" data-i18n="extNameShort"></p>
    </div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
