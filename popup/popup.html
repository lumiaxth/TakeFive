<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title data-i18n="extNameShort"></title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="logo" src="../icons/icon32.png" alt="" />
        <span id="brandName" data-i18n="extNameShort"></span>
      </div>
      <div class="header-actions">
        <span id="activeHost" class="active-host" hidden></span>
        <button id="btnDashboard" class="icon-btn" type="button" data-i18n-title="openDashboard" aria-label="Dashboard">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="20" x2="6" y2="14"></line>
            <line x1="12" y1="20" x2="12" y2="10"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
          </svg>
        </button>
        <button id="btnSettings" class="icon-btn" type="button" data-i18n-title="openSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="pausedBanner" class="paused-banner" hidden></div>

    <main>
      <section class="summary">
        <div class="total">
          <div id="totalValue" class="total-value">0m</div>
          <div class="total-label" data-i18n="totalLabel"></div>
        </div>
        <div class="actions">
          <button id="btnPause" class="btn primary" type="button" data-i18n="pause"></button>
          <button id="btnResume" class="btn" type="button" hidden data-i18n="resume"></button>
        </div>
      </section>

      <section class="list">
        <h2 data-i18n="domainsTitle"></h2>
        <div id="domainList"></div>
        <div id="empty" class="empty" hidden data-i18n="noDataYet"></div>
      </section>
    </main>

    <div id="pomodoroBar" class="pomodoro-bar" hidden>
      <span id="pomodoroInfo" data-i18n="pomodoroIdle"></span>
      <button id="btnPomodoro" class="btn small" type="button" data-i18n="pomodoroStartFocus"></button>
    </div>

    <script src="../shared/tldts.min.js"></script>
    <script src="../shared/hostname.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
