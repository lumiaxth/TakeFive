<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="options.css" />
    <title data-i18n="optionsTitle"></title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <img class="logo" src="../icons/icon32.png" alt="" />
          <h1 data-i18n="optionsTitle"></h1>
        </div>
        <div class="nav-actions">
          <button id="btnWelcome" class="icon-btn" type="button" data-i18n-title="openWelcome" aria-label="Welcome">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>
          <button id="btnDashboard" class="icon-btn" type="button" data-i18n-title="openDashboard" aria-label="Dashboard">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="20" x2="6" y2="14"></line>
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
            </svg>
          </button>
        </div>
      </header>

      <section id="section-appearance" class="card">
        <h2 data-i18n="appearanceSection"></h2>
        <p class="hint" data-i18n="appearanceHint"></p>
        <div class="field">
          <label for="themeMode" data-i18n="themeLabel"></label>
          <select id="themeMode">
            <option value="system" data-i18n="themeSystem"></option>
            <option value="light" data-i18n="themeLight"></option>
            <option value="dark" data-i18n="themeDark"></option>
          </select>
        </div>
        <div class="field">
          <label for="badgeMode" data-i18n="badgeSection"></label>
          <select id="badgeMode">
            <option value="auto" data-i18n="badgeModeAuto"></option>
            <option value="total" data-i18n="badgeModeTotal"></option>
            <option value="domain" data-i18n="badgeModeDomain"></option>
          </select>
        </div>
      </section>

      <section id="section-countdown" class="card">
        <h2 data-i18n="countdownSection"></h2>
        <p class="hint" data-i18n="countdownHint"></p>
        <div class="field check-row">
          <label class="check">
            <input id="countdownEnabled" type="checkbox" />
            <span data-i18n="countdownEnabled"></span>
          </label>
        </div>
        <div class="field check-row">
          <label class="check">
            <input id="floatingClockEnabled" type="checkbox" />
            <span data-i18n="floatingClock"></span>
          </label>
        </div>
        <div class="field check-row">
          <label class="check">
            <input id="hideFullscreen" type="checkbox" />
            <span data-i18n="hideFullscreenLabel"></span>
          </label>
        </div>
        <div class="field">
          <label for="countdownThreshold" data-i18n="countdownThreshold"></label>
          <input id="countdownThreshold" type="number" min="1" max="180" value="15" />
        </div>
        <div class="field">
          <label for="countdownPosition" data-i18n="countdownPosition"></label>
          <select id="countdownPosition">
            <option value="top-left" data-i18n="countdownPosTopLeft"></option>
            <option value="top-right" data-i18n="countdownPosTopRight"></option>
            <option value="middle-left" data-i18n="countdownPosMiddleLeft"></option>
            <option value="middle-right" data-i18n="countdownPosMiddleRight"></option>
            <option value="bottom-left" data-i18n="countdownPosBottomLeft"></option>
            <option value="bottom-right" data-i18n="countdownPosBottomRight"></option>
          </select>
        </div>
        <div class="field">
          <label for="countdownSize" data-i18n="countdownSize"></label>
          <select id="countdownSize">
            <option value="small" data-i18n="countdownSizeSmall"></option>
            <option value="medium" data-i18n="countdownSizeMedium"></option>
            <option value="large" data-i18n="countdownSizeLarge"></option>
          </select>
        </div>
      </section>

      <section id="section-usage-reminder" class="card">
        <h2 data-i18n="usageReminderSection"></h2>
        <p class="hint" data-i18n="usageReminderHint"></p>
        <div class="field check-row">
          <label class="check">
            <input id="usageReminderEnabled" type="checkbox" />
            <span data-i18n="usageReminderEnabled"></span>
          </label>
        </div>
        <div class="field">
          <label for="usageReminderMinutes" data-i18n="usageReminderMinutes"></label>
          <input id="usageReminderMinutes" type="number" min="1" max="600" value="45" />
        </div>
      </section>

      <section id="section-pomodoro" class="card">
        <h2 data-i18n="pomodoroSection"></h2>
        <p class="hint" data-i18n="pomodoroHint"></p>
        <div class="field check-row">
          <label class="check">
            <input id="pomodoroEnabled" type="checkbox" />
            <span data-i18n="pomodoroEnabled"></span>
          </label>
        </div>
        <div class="field">
          <label for="pomodoroFocusMinutes" data-i18n="pomodoroFocusMinutes"></label>
          <input id="pomodoroFocusMinutes" type="number" min="1" max="180" value="25" />
          <label for="pomodoroBreakMinutes" data-i18n="pomodoroBreakMinutes"></label>
          <input id="pomodoroBreakMinutes" type="number" min="1" max="120" value="5" />
        </div>
        <div id="pomodoroStatus" class="pomodoro-status"></div>
        <h3 data-i18n="pomodoroWhitelistSection"></h3>
        <p class="hint" data-i18n="pomodoroWhitelistHint"></p>
        <div id="pomodoroWhitelistList" class="rule-list"></div>
        <div id="noPomodoroWhitelist" class="empty" hidden data-i18n="noPomodoroWhitelistYet"></div>
        <form id="pomodoroWhitelistForm" class="add-form">
          <input id="pomodoroWhitelistDomain" type="text" data-i18n-placeholder="domainPlaceholder" />
          <button class="btn primary" type="submit" data-i18n="addPomodoroWhitelist"></button>
        </form>
        <div class="import-row">
          <button id="btnImportWhitelist" class="btn" type="button" data-i18n="importPomodoroWhitelist"></button>
        </div>
      </section>

      <section id="section-limits" class="card">
        <h2 data-i18n="limitsSection"></h2>
        <p class="hint" data-i18n="limitsHint"></p>
        <div id="limitList" class="rule-list"></div>
        <div id="noLimits" class="empty" hidden data-i18n="noLimitsYet"></div>
        <form id="limitForm" class="add-form">
          <input id="limitDomain" type="text" data-i18n-placeholder="domainPlaceholder" />
          <input id="limitDaily" type="number" min="1" data-i18n-placeholder="limitDaily" />
          <input id="limitRemind" type="number" min="0" data-i18n-placeholder="remindAt" />
          <button class="btn primary" type="submit" data-i18n="addLimit"></button>
        </form>
      </section>

      <section id="section-blacklist" class="card">
        <h2 data-i18n="blacklistSection"></h2>
        <p class="hint" data-i18n="blacklistHint"></p>
        <div id="blacklistList" class="rule-list"></div>
        <div id="noBlacklist" class="empty" hidden data-i18n="noBlacklistYet"></div>
        <form id="blacklistForm" class="add-form">
          <input id="blacklistDomain" type="text" data-i18n-placeholder="domainPlaceholder" />
          <button class="btn primary" type="submit" data-i18n="addBlacklist"></button>
        </form>
      </section>
    </div>

    <script src="../shared/tldts.min.js"></script>
    <script src="../shared/hostname.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../content/countdown.js"></script>
    <script src="options.js"></script>
  </body>
</html>
